<!DOCTYPE html>
<html>
<head>
    <title>Tables and Lists Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        h2 {
            color: #0066cc;
        }

        table {
            width: 60%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #0066cc;
            color: white;
        }

        ul {
            background-color: white;
            width: 200px;
            padding: 15px;
            border: 1px solid #ccc;
        }

        li {
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <h1>Table and List Examples</h1>

    <h2>Simple Data Table</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Alice</td>
            <td>30</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>25</td>
            <td>London</td>
        </tr>
    </table>

    <hr>

    <h2>Shopping List</h2>

    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Milk</li>
        <li>Bread</li>
    </ul>

</body>
</html>
