<!DOCTYPE html>
<html>
<head>
<title>User Form</title>
<style>
body {
background: #f3f3f3;
font-family: Arial;
}
.container {
width: 350px;
background: white;
padding: 20px;
margin: 50px auto;
border-radius: 10px;
box-shadow: 0 0 10px gray;
}
input {
width: 95%;
padding: 10px;
margin-top: 10px;
border-radius: 5px;
border: 1px solid gray;
}
button {
padding: 10px;
width: 100%;
background: blue;
color: white;
border: none;
margin-top: 15px;
border-radius: 5px;
cursor: pointer;
}
button:hover {
background: darkblue;
}
</style>
<script>
function validateForm() {
let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
if (name == "" || email == "") {
alert("Both fields are required!");
return false;
}
if (!email.includes("@")) {
alert("Enter a valid email ID!");
return false;
}
return true;
}
</script>
</head>
<body>
<div class="container">
<h2>Save User</h2>
<form action="save.php" method="post" onsubmit="return validateForm()">
<input type="text" id="name" name="name" placeholder="Enter Name">
<input type="text" id="email" name="email" placeholder="Enter Email">
<button type="submit">Save</button>
</form>
</div>
</body>
</html>
