<!DOCTYPE html>
<html>
<head>
    <title>iFrame Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        iframe {
            border: 2px solid #007BFF;
            border-radius: 5px;
            margin: 10px;
        }
    </style>
</head>
<body>

    <h1>Modern Web Layout with iFrames</h1>

    <iframe src="https://www.example.com"
            width="300"
            height="400"
            title="Example Website 1">
    </iframe>

    <iframe src="https://www.wikipedia.org"
            width="600"
            height="400"
            title="Example Website 2">
    </iframe>

</body>
</html>
