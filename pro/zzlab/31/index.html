<!DOCTYPE html>
<html>
<head>
<title>Form Data to JSON Download</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }label { display: block; margin-bottom: 5px; font-weight: bold; }
input[type="text"], input[type="email"] { width: 100%; padding: 8px; margin-bottom:
15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
button { padding: 10px 15px; background-color: #007bff; color: white; border: none;
border-radius: 4px; cursor: pointer; }
button:hover { background-color: #0056b3; }
.output-box { margin-top: 20px; padding: 15px; background-color: #f8f9fa; border: 1pxdashed #ced4da; }
</style>
</head>
<body>
<h1>Collect Data and Create JSON File</h1>
<form id="dataForm">
<label for="userName">Name:</label>
<input type="text" id="userName" name="name" required>
<label for="userEmail">Email:</label>
<input type="email" id="userEmail" name="email" required>
<label for="userRole">Role:</label>
<input type="text" id="userRole" name="role" required>
<button type="submit">Convert to JSON & Download</button>
</form>
<div class="output-box">
<p><strong>JSON Output (Console):</strong> Check your browser console (F12) for
the raw JSON string.</p>
</div>
<script>
document.getElementById('dataForm').addEventListener('submit', function(event) {
event.preventDefault();
const formData = new FormData(event.target);
const dataObject = {};
formData.forEach((value, key) => {
dataObject[key] = value;
});
dataObject.submissionDate = new Date().toISOString();
const jsonString = JSON.stringify(dataObject, null, 2);
console.log("JSON Data to be Saved:", jsonString);
const blob = new Blob([jsonString], { type: 'application/json' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = 'form_data_' + Date.now() + '.json';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
});
</script>
</body>
</html>
