<!DOCTYPE html>
<html>
<head>
<title>User Registration</title>
<style>
body{font-family:Arial;text-align:center;margin-top:50px;}
form{display:inline-block;padding:20px;border:1px solid #ccc;}
input{display:block;width:220px;margin:10px;padding:8px;}
button{padding:8px 20px;}
</style>
</head>
<body>

<h2>User Registration Form</h2>

<form onsubmit="return validate()">
<input type="text" id="name" placeholder="Enter Name">
<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">
<button type="submit">Register</button>
</form>

<script>
function validate(){
let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

if(name==""){ alert("Enter Name"); return false; }

if(email==""){ alert("Enter Email"); return false; }

let pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if(!pattern.test(email)){ alert("Invalid Email"); return false; }

if(password.length<6){
alert("Password must be at least 6 characters");
return false;
}

alert("Registration Successful!");
return true;
}
</script>

</body>
</html>
