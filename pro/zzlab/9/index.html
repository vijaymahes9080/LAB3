<!DOCTYPE html>
<html>
<head>
    <title>HTML Emojis</title>
</head>
<body>

    <h2>Using Unicode Emojis</h2>

    <div>
        😀 Grinning Face
    </div>

    <div>
        👍 Thumbs Up
    </div>

    <div>
        ❤️ Red Heart
    </div>

    <hr>

    <h2>Using HTML Entity (Hex)</h2>

    <div>
        &#x1F601; Grinning Face with Smiling Eyes
    </div>

    <div>
        &#x1F4A1; Light Bulb
    </div>

    <div>
        &#x1F680; Rocket
    </div>

</body>
</html>
